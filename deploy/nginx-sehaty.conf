# Reverse-proxy vhost for the Sehaty API, to drop into an EXISTING nginx on a
# shared host (where nginx already owns :80/:443). It forwards the public API
# hostname to the sehaty `api` container, which is published on 127.0.0.1:8088.
#
# Install on the droplet (additive — does not touch other vhosts):
#   HOST=$(grep '^SEHATY_API_HOST=' /opt/sehaty/sehaty-api/deploy/.env | cut -d= -f2)
#   sed "s/__SEHATY_API_HOST__/$HOST/" /opt/sehaty/sehaty-api/deploy/nginx-sehaty.conf \
#     | sudo tee /etc/nginx/sites-available/sehaty.conf
#   sudo ln -sf /etc/nginx/sites-available/sehaty.conf /etc/nginx/sites-enabled/sehaty.conf
#   sudo nginx -t && sudo systemctl reload nginx        # validate BEFORE reload
#   sudo certbot --nginx -d "$HOST"                     # certbot rewrites this for TLS
#
# (If this nginx uses conf.d instead of sites-enabled, drop the file in
#  /etc/nginx/conf.d/sehaty.conf instead of the sites-available/enabled pair.)

server {
    listen 80;
    listen [::]:80;
    server_name __SEHATY_API_HOST__;

    # Room for the Excel export / prescription PDFs.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
