# Sehaty pilot stack: Postgres+PostGIS, a one-shot migrator, the API, and Caddy
# (auto-HTTPS reverse proxy). The front-end is deployed separately on Vercel.
#
# The API image is built from ../../sehaty-api/Dockerfile with the MONOREPO ROOT
# as the build context (context: ../..), because sehaty-api depends on its
# sibling repos sehaty-core and sehaty-db as path deps. So on the droplet the
# three repos must sit as siblings:
#   <root>/sehaty-api  <root>/sehaty-core  <root>/sehaty-db
#
# Usage (from this deploy/ directory):
#   cp .env.example .env      # then edit the secrets
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
name: sehaty

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sehaty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sehaty}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sehaty} -d ${POSTGRES_DB:-sehaty}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: bring the schema to head, then exit. The API never migrates on boot
  # (schema is owned by sehaty-db); this is that out-of-band step, wired in.
  migrate:
    image: sehaty-api:local
    build:
      context: ../..
      dockerfile: sehaty-api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    command: ["alembic", "-c", "/sehaty-db/src/sehaty/db/_migrations/alembic.ini", "upgrade", "head"]
    restart: "no"

  api:
    image: sehaty-api:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      # The secret that SIGNS tokens (sehaty.core.config reads SEHATY_JWT_SECRET).
      SEHATY_JWT_SECRET: ${SEHATY_JWT_SECRET:?set SEHATY_JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SEHATY_ENV: ${SEHATY_ENV:-prod}
      # Chatbot. Listed here because compose passes only what it is told to:
      # a key sitting in .env but absent from this block reaches nothing, and the
      # symptom is a feature that stays silently unavailable with no error to
      # follow. Empty is a supported state — triage falls back to a generalist
      # and translation refuses out loud.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SEHATY_LLM_MODEL: ${SEHATY_LLM_MODEL:-}
    # Published to localhost only — the host's existing nginx reverse-proxies
    # ${SEHATY_API_HOST} to it and terminates TLS. Not reachable from outside the
    # droplet directly. (No Caddy here: on a shared box nginx already owns 80/443.)
    ports:
      - "127.0.0.1:8088:8000"

volumes:
  pgdata:
