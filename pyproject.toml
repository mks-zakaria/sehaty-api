[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sehaty-api"
description = "Sehaty transport layer: FastAPI routers over sehaty-core. Parse -> one controller -> return."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]",
    "bcrypt>=5",
    "python-multipart",
    "sehaty-core",
    "sehaty-db",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13", "python-semantic-release>=9"]

[tool.uv.sources]
sehaty-core = { path = "../sehaty-core", editable = true }
sehaty-db = { path = "../sehaty-db", editable = true }

# Flat `src/` application (not an importable package): the FastAPI entry point
# is `src/main.py`, run via `uvicorn main:app --app-dir src`. semantic-release
# rewrites `src/_version.py`; setuptools reads the literal via AST at build.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main", "core_config", "_version"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["routers*", "schemas*"]

[tool.setuptools.dynamic]
version = { attr = "_version.__version__" }

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are called in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.semantic_release]
major_on_zero = false
tag_format = "v{version}"
version_variables = ["src/_version.py:__version__"]
commit_message = "Release {version}\n\n[skip ci] Automatically generated by python-semantic-release"
build_command = ""

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "MKS~ZAK <60817481+mks-zakaria@users.noreply.github.com>"

[tool.semantic_release.remote.token]
env = "GH_TOKEN"
