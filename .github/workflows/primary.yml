name: primary
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sehaty-api
      # sehaty-api depends on sehaty-core and sehaty-db via local path sources
      # (../sehaty-core, ../sehaty-db). Both must be checked out alongside
      # before `uv sync` can resolve them.
      - uses: actions/checkout@v4
        with:
          repository: mks-zakaria/sehaty-db
          path: sehaty-db
          token: ${{ secrets.SEHATY_CI_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: mks-zakaria/sehaty-core
          path: sehaty-core
          token: ${{ secrets.SEHATY_CI_PAT }}
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
        working-directory: sehaty-api
      - run: uv run ruff check .
        working-directory: sehaty-api
      - run: uv run ruff format --check .
        working-directory: sehaty-api
      - run: uv run pytest -q
        working-directory: sehaty-api
      - run: uv run mypy src
        working-directory: sehaty-api
        continue-on-error: true # ratchet to required once clean
